<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A friendly shark">
  <ellipse cx="110" cy="206" rx="62" ry="9" fill="#3D2C56" opacity="0.10"></ellipse>

  <!-- tail -->
  <path d="M150 150 L196 122 L188 168 L196 190 Z" fill="#6C93B8"></path>

  <!-- body -->
  <ellipse cx="104" cy="140" rx="66" ry="50" fill="#7FA8CC"></ellipse>
  <!-- pale belly -->
  <path d="M46 152 Q104 196 164 156 Q104 176 46 152 Z" fill="#DCE9F4"></path>

  <!-- dorsal fin -->
  <path d="M104 90 L86 52 L128 84 Z" fill="#6C93B8"></path>
  <!-- side fin -->
  <path d="M78 176 L64 200 L104 184 Z" fill="#6C93B8"></path>

  <!-- gills -->
  <path d="M138 128 q4 12 0 24 M150 126 q4 12 0 26 M162 128 q4 11 0 22" stroke="#6C93B8" stroke-width="3" fill="none" stroke-linecap="round"></path>

  <!-- big friendly smile -->
  <path d="M60 148 Q104 176 150 150" fill="none" stroke="#3B5C7A" stroke-width="4" stroke-linecap="round"></path>
  <!-- little tooth -->
  <path d="M92 162 l6 8 l6 -8 Z" fill="#FFFFFF"></path>
  <path d="M110 164 l6 8 l6 -8 Z" fill="#FFFFFF"></path>

  <!-- eyes -->
  <circle cx="78" cy="120" r="9" fill="#FFFFFF"></circle>
  <circle cx="104" cy="118" r="9" fill="#FFFFFF"></circle>
  <circle cx="80" cy="121" r="4.5" fill="#43352F"></circle>
  <circle cx="105" cy="119" r="4.5" fill="#43352F"></circle>
  <circle cx="81.5" cy="119.5" r="1.6" fill="#FFFFFF"></circle>
  <circle cx="106.5" cy="117.5" r="1.6" fill="#FFFFFF"></circle>
  <circle cx="66" cy="136" r="6" fill="#FF8FB1" opacity="0.5"></circle>
</svg>
