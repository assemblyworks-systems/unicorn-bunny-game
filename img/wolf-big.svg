<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The big bad wolf">
  <ellipse cx="110" cy="206" rx="66" ry="9" fill="#3D2C56" opacity="0.10"></ellipse>

  <!-- tail -->
  <path d="M156 168 Q198 156 188 116 Q182 146 152 154 Z" fill="#5E6B78"></path>
  <path d="M188 116 Q184 136 172 148" fill="none" stroke="#8E9AA6" stroke-width="6" stroke-linecap="round"></path>

  <!-- body -->
  <ellipse cx="110" cy="152" rx="56" ry="48" fill="#6E7B88"></ellipse>
  <ellipse cx="110" cy="164" rx="34" ry="30" fill="#B8C2CC"></ellipse>
  <ellipse cx="82" cy="194" rx="17" ry="10" fill="#5E6B78"></ellipse>
  <ellipse cx="138" cy="194" rx="17" ry="10" fill="#5E6B78"></ellipse>

  <!-- head -->
  <circle cx="110" cy="86" r="48" fill="#6E7B88"></circle>

  <!-- pointed ears -->
  <path d="M70 52 L58 12 L98 42 Z" fill="#6E7B88"></path>
  <path d="M150 52 L162 12 L122 42 Z" fill="#6E7B88"></path>
  <path d="M74 48 L68 26 L90 44 Z" fill="#43352F" opacity="0.35"></path>
  <path d="M146 48 L152 26 L130 44 Z" fill="#43352F" opacity="0.35"></path>

  <!-- snout -->
  <ellipse cx="110" cy="106" rx="30" ry="22" fill="#B8C2CC"></ellipse>
  <ellipse cx="110" cy="94" rx="9" ry="6.5" fill="#43352F"></ellipse>
  <path d="M110 100 v9" stroke="#43352F" stroke-width="3" stroke-linecap="round"></path>
  <!-- goofy grin with little tongue -->
  <path d="M96 114 q14 12 28 0" stroke="#43352F" stroke-width="3.4" fill="none" stroke-linecap="round"></path>
  <path d="M108 120 q4 8 8 0 Z" fill="#FF8FB1"></path>

  <!-- big sly eyebrows -->
  <path d="M80 64 q12 -8 22 0" stroke="#43352F" stroke-width="4" fill="none" stroke-linecap="round"></path>
  <path d="M118 64 q10 -8 22 0" stroke="#43352F" stroke-width="4" fill="none" stroke-linecap="round"></path>

  <!-- eyes -->
  <circle cx="92" cy="80" r="7.5" fill="#43352F"></circle>
  <circle cx="128" cy="80" r="7.5" fill="#43352F"></circle>
  <circle cx="94" cy="78" r="2.3" fill="#FFFFFF"></circle>
  <circle cx="130" cy="78" r="2.3" fill="#FFFFFF"></circle>
</svg>
