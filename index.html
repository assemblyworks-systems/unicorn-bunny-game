<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Playbox — Little adventures, big discoveries</title>
<meta name="description" content="A playful collection of stories, creative activities and early learning games. Made for little hands, with no ads or accounts.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFF9F0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Playbox">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="playbox.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { height:100%; overflow:hidden; touch-action:manipulation; }
  body { font-family:var(--font-body); background:var(--surface-app); color:var(--text-body); cursor:pointer; }
  #app { position:fixed; inset:0; transition:background .6s ease; background:var(--surface-app); }

  /* ===== Top bar ===== */
  #topbar { position:fixed; top:0; left:0; right:0; height:68px; z-index:60; display:none; align-items:center; justify-content:space-between; padding:10px 14px 0; }
  #backBtn {
    font-family:var(--font-display); font-size:20px; font-weight:800; color:var(--text-on-color);
    background:var(--color-grape); border:none; border-radius:var(--radius-pill); padding:10px 22px;
    box-shadow:0 var(--chunk-depth) 0 var(--color-grape-deep); cursor:pointer;
    transition:transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
  }
  #backBtn:active { transform:translateY(4px); box-shadow:0 var(--chunk-depth-press) 0 var(--color-grape-deep); }
  #score {
    font-family:var(--font-display); background:var(--color-white); border-radius:var(--radius-pill);
    padding:8px 22px; font-size:24px; font-weight:800; color:var(--color-sunshine-deep);
    white-space:nowrap; box-shadow:var(--shadow-soft);
  }
  #soundBtn { font-family:var(--font-display); font-size:22px; background:var(--color-white); border:none; border-radius:var(--radius-pill); padding:9px 15px; cursor:pointer; box-shadow:var(--shadow-soft); }

  /* ===== Screens ===== */
  .screen { position:fixed; inset:0; }
  .hidden { display:none !important; }

  /* ===== Home menu ===== */
  #home { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:20px; text-align:center; overflow-y:auto; }
  #home .big { display:flex; gap:6px; align-items:flex-end; justify-content:center; animation:bob 1.8s ease-in-out infinite; }
  #home .big img { width:104px; height:104px; filter:drop-shadow(0 8px 8px var(--tint-ink)); }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  #home h1 { font-family:var(--font-display); font-size:40px; font-weight:800; color:var(--color-ink); }
  #homeSub{ font-family:var(--font-display); font-size:19px; font-weight:700; color:var(--color-grape); margin-top:-6px; }
  #menu { display:grid; grid-template-columns:1fr 1fr; gap:var(--tile-gap); width:100%; max-width:540px; }
  @media (orientation:landscape){ #menu{ grid-template-columns:repeat(3,1fr); max-width:840px; } }
  .menu-btn {
    font-family:var(--font-display); font-size:21px; font-weight:800; color:var(--tone-on,var(--text-on-color));
    background:var(--tone,var(--color-sky)); border:none; border-radius:var(--radius-lg);
    padding:16px 10px 18px; box-shadow:0 var(--chunk-depth) 0 var(--tone-deep,var(--color-sky-deep)); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    transition:transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
  }
  .menu-btn .emo { font-size:52px; line-height:1; }
  .menu-btn .emo img { width:58px; height:58px; vertical-align:middle; }
  .menu-btn:active { transform:translateY(4px); box-shadow:0 var(--chunk-depth-press) 0 var(--tone-deep,var(--color-sky-deep)); }

  /* Home charm — drifting spot illustrations behind the menu */
  .decor{ position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .decor img{ position:absolute; opacity:.5; filter:drop-shadow(0 4px 6px var(--tint-ink)); }
  .decor .d1{ width:120px; top:9%; left:6%; animation:floaty2 6s ease-in-out infinite; }
  .decor .d2{ width:62px; top:15%; right:9%; animation:floaty2 5s ease-in-out infinite .6s; }
  .decor .d3{ width:130px; bottom:8%; right:7%; animation:floaty2 7s ease-in-out infinite .3s; }
  @keyframes floaty2{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
  #home .big, #home h1, #homeSub, #menu, .homeRow{ position:relative; z-index:1; }

  /* ===== Critters & effects ===== */
  .critter { position:absolute; font-size:90px; line-height:1; will-change:transform; filter:drop-shadow(0 6px 6px var(--tint-ink)); }
  .critter img { width:1em; height:1em; pointer-events:none; display:block; }
  .critter:active { transform:scale(1.2); }
  .pop { animation:pop 0.45s forwards; pointer-events:none; }
  @keyframes pop { 0%{transform:scale(1.3)} 100%{transform:scale(0) rotate(40deg); opacity:0;} }

  .spark { position:absolute; font-size:32px; pointer-events:none; animation:spark 0.7s ease-out forwards; }
  @keyframes spark { 0%{transform:translate(0,0) scale(0.4); opacity:1;} 100%{transform:translate(var(--dx),var(--dy)) scale(1.4); opacity:0;} }

  .shake { animation:shake 0.4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-12px) rotate(-8deg)} 75%{transform:translateX(12px) rotate(8deg)} }
  .match-banner {
    position:fixed; top:78px; left:50%; transform:translateX(-50%); z-index:55;
    background:var(--color-white); border-radius:var(--radius-pill); padding:8px 24px;
    font-family:var(--font-display); font-size:22px; font-weight:800; color:var(--color-ink);
    display:flex; align-items:center; gap:10px; pointer-events:none; white-space:nowrap; box-shadow:var(--shadow-soft);
  }
  .match-banner .big { font-size:46px; }
  .match-banner .big img { width:46px; height:46px; vertical-align:middle; }

  .cheer {
    position:fixed; left:50%; top:40%; transform:translate(-50%,-50%);
    font-family:var(--font-display); font-size:54px; font-weight:800; color:var(--color-white); pointer-events:none; z-index:55;
    text-shadow:0 3px 0 var(--color-bubblegum), 0 0 14px rgba(255,255,255,0.6);
    animation:cheer 1s ease-out forwards; white-space:nowrap; text-align:center;
  }
  @keyframes cheer { 0%{transform:translate(-50%,-50%) scale(0.3); opacity:0;} 25%{transform:translate(-50%,-50%) scale(1.1); opacity:1;} 100%{transform:translate(-50%,-72%) scale(1.1); opacity:0;} }

  /* Feed-the-bunny pet */
  #pet { position:absolute; bottom:24px; left:50%; transform:translateX(-50%); z-index:20; filter:drop-shadow(0 8px 8px var(--tint-ink)); }
  #pet img { width:150px; height:150px; display:block; }
  .nom { animation:nom 0.4s ease; }
  @keyframes nom { 0%,100%{transform:translateX(-50%) scale(1)} 50%{transform:translateX(-50%) scale(1.22)} }

  .scene-label {
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    background:var(--color-white); color:var(--text-muted); font-family:var(--font-display); font-size:17px; font-weight:700;
    padding:6px 18px; border-radius:var(--radius-pill); z-index:50; pointer-events:none; box-shadow:var(--shadow-soft);
  }

  /* ===== Home links row (Learn / Change Profile) ===== */
  .homeRow{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:14px; }
  .homeLink{
    display:inline-flex; align-items:center; gap:8px; text-decoration:none;
    font-family:var(--font-display); font-size:18px; font-weight:800; color:var(--text-on-color);
    background:var(--color-sky); border:none; border-radius:var(--radius-pill); padding:12px 22px;
    box-shadow:0 var(--chunk-depth) 0 var(--color-sky-deep); cursor:pointer;
    transition:transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
  }
  .homeLink:active{ transform:translateY(4px); box-shadow:0 var(--chunk-depth-press) 0 var(--color-sky-deep); }
  .homeLink.alt{ background:var(--color-bubblegum); box-shadow:0 var(--chunk-depth) 0 var(--color-bubblegum-deep); }
  .homeLink.alt:active{ box-shadow:0 var(--chunk-depth-press) 0 var(--color-bubblegum-deep); }

  /* ===== Profile gate ===== */
  #gate{ display:flex; align-items:center; justify-content:center; padding:24px; z-index:100; background:var(--surface-app); }
  .gateCard{ background:var(--color-white); border-radius:var(--radius-xl); padding:32px 26px; max-width:430px; width:100%; text-align:center; box-shadow:var(--shadow-pop); display:flex; flex-direction:column; gap:16px; align-items:center; }
  .gateHero{ display:flex; gap:4px; align-items:flex-end; animation:bob 1.7s ease-in-out infinite; }
  .gateHero img{ width:88px; height:88px; }
  .gateTitle{ font-family:var(--font-display); font-size:34px; font-weight:800; color:var(--color-ink); }
  .gateSub{ font-family:var(--font-body); font-size:20px; font-weight:700; color:var(--text-muted); }
  #gateName{ font-family:var(--font-body); font-weight:700; font-size:22px; text-align:center; padding:14px 18px; border:3px solid var(--color-line); border-radius:var(--radius-md); width:100%; outline:none; color:var(--color-ink); background:var(--surface-sunk); }
  #gateName:focus{ border-color:var(--color-sky); }
  .gateBtn{ font-family:var(--font-display); font-size:24px; font-weight:800; color:var(--text-on-color); background:var(--color-coral); border:none; border-radius:var(--radius-pill); padding:14px 32px; box-shadow:0 var(--chunk-depth) 0 var(--color-coral-deep); cursor:pointer; transition:transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out); }
  .gateBtn:active{ transform:translateY(4px); box-shadow:0 var(--chunk-depth-press) 0 var(--color-coral-deep); }
  .gateErr{ font-family:var(--font-body); font-size:18px; font-weight:700; color:var(--color-coral-deep); min-height:22px; }

  /* ===== Princess dress-up ===== */
  #dressWrap{ position:absolute; left:50%; top:47%; transform:translate(-50%,-50%); width:min(58vw,300px); }
  #dressWrap svg{ width:100%; height:auto; display:block; filter:drop-shadow(0 8px 8px var(--tint-ink)); }
  #dressWrap svg.twirl{ animation:twirl .9s ease; }
  @keyframes twirl{ 0%{transform:rotate(0) scale(1)} 30%{transform:rotate(-14deg) scale(1.06)} 70%{transform:rotate(372deg) scale(1.1)} 100%{transform:rotate(360deg) scale(1)} }
  #dressBar{ position:absolute; left:0; right:0; bottom:10px; display:flex; gap:9px; justify-content:center; align-items:center; flex-wrap:wrap; padding:0 10px; z-index:30; }

  /* ===== Draw ===== */
  #drawWrap{ position:absolute; left:12px; right:12px; top:78px; bottom:132px; background:#FFFFFF; border-radius:var(--radius-lg); box-shadow:var(--shadow-pop); overflow:hidden; touch-action:none; }
  #drawCanvas{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  #drawBar{ position:absolute; left:0; right:0; bottom:10px; display:flex; gap:9px; justify-content:center; align-items:center; flex-wrap:wrap; padding:0 10px; z-index:30; }
  .crayon{ width:44px; height:44px; border-radius:50%; border:4px solid var(--color-white); box-shadow:var(--shadow-soft); cursor:pointer; padding:0; }
  .crayon.sel{ transform:scale(1.22); border-color:var(--color-ink); }
  .stampBtn{ width:48px; height:48px; background:var(--color-white); border-radius:var(--radius-md); border:none; box-shadow:var(--shadow-soft); font-size:28px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  .stampBtn img{ width:34px; height:34px; }
  .stampBtn.sel{ outline:4px solid var(--color-grape); }

  /* ===== Candy House trail ===== */
  .cbadge{ position:absolute; top:-12px; right:-10px; min-width:26px; height:26px; padding:0 4px; border-radius:var(--radius-pill); background:var(--color-grape); color:var(--color-white); font-family:var(--font-display); font-weight:800; font-size:17px; display:flex; align-items:center; justify-content:center; z-index:2; }
  .pulseC{ animation:cpulse 1s ease-in-out infinite; }
  @keyframes cpulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.22)} }

  /* ===== Dino Dig ===== */
  #digWrap{ position:absolute; left:50%; top:54%; transform:translate(-50%,-50%); width:min(80vw,440px); height:min(80vw,440px); border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-pop); background:#E9D2A8; touch-action:none; }
  .digDino{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:190px; line-height:1; filter:drop-shadow(0 6px 6px var(--tint-ink)); }
  .digDino img{ width:74%; height:74%; }
  .digDino.reveal{ animation:digpop .6s; }
  @keyframes digpop{ 0%{transform:scale(.6)} 55%{transform:scale(1.18)} 100%{transform:scale(1)} }
  #digCanvas{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  .digHint{ position:absolute; bottom:10px; left:50%; transform:translateX(-50%); z-index:5; background:var(--color-white); color:var(--text-muted); font-family:var(--font-display); font-size:17px; font-weight:700; padding:6px 16px; border-radius:var(--radius-pill); pointer-events:none; white-space:nowrap; }

  /* ===== 拔萝卜 Pull the Radish ===== */
  .radishBig{ position:absolute; z-index:6; filter:drop-shadow(0 6px 6px var(--tint-ink)); }
  .radishBig img{ width:100%; height:auto; display:block; }
  .radishMound{ position:absolute; z-index:5; border-radius:50%; background:#C99A63; box-shadow:inset 0 6px 0 #B4854E; }
  .radishRope{ position:absolute; z-index:7; height:9px; border-radius:var(--radius-pill); background:#B4854E; transform-origin:left center; }
  .radishHelper{ position:absolute; z-index:8; filter:drop-shadow(0 5px 5px var(--tint-ink)); transition:left .3s var(--ease-out), top .3s var(--ease-out); }
  .radishHelper img{ width:100%; height:auto; display:block; transform:rotate(-9deg); }
  @keyframes rpop{ 0%{transform:translateY(0) rotate(0)} 22%{transform:translateY(12px)} 100%{transform:translateY(-160px) rotate(360deg)} }
  .radishPulled{ animation:rpop 1s ease-in forwards; }
  @keyframes rwiggle{ 0%,100%{transform:translateX(0) rotate(0)} 25%{transform:translateX(-9px) rotate(-4deg)} 75%{transform:translateX(9px) rotate(4deg)} }
  .radishWiggle{ animation:rwiggle .5s; }
  @keyframes htumble{ 0%{transform:translateY(0) rotate(-9deg)} 100%{transform:translateY(46px) rotate(-82deg); opacity:.55} }
  .helperTumble img{ animation:htumble .6s ease-in forwards; }
  .eqSign{ position:fixed; top:66px; left:50%; transform:translateX(-50%); z-index:45; background:var(--color-white); border-radius:var(--radius-lg); box-shadow:var(--shadow-soft); padding:9px 20px; display:flex; flex-direction:column; align-items:center; gap:5px; }
  .eqRow{ display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:800; font-size:38px; color:var(--color-ink); line-height:1; }
  .eqRow .q{ color:var(--color-tangerine); }
  .eqRow .q.reveal{ color:var(--color-grass); animation:cpulse 1s ease-in-out infinite; }
  .eqDots{ display:flex; gap:12px; align-items:center; }
  .eqDots .grp{ display:flex; gap:4px; }
  .eqDots .dot{ width:13px; height:13px; border-radius:50%; background:var(--color-tangerine); }
  .eqDots .dot.off{ background:var(--color-line); opacity:.5; }
  .eqCount{ font-family:var(--font-body); font-weight:800; font-size:18px; color:var(--text-muted); }
  .eqCount b{ color:var(--color-grass); font-size:24px; }
  .radishHelper .rhName{ position:absolute; left:50%; bottom:-15px; transform:translateX(-50%); font-family:var(--font-body); font-weight:800; font-size:13px; color:var(--color-ink); white-space:nowrap; text-shadow:0 1px 0 #fff, 0 0 3px #fff; }
  #radishTray{ position:fixed; left:0; right:0; bottom:6px; display:flex; gap:6px; justify-content:center; align-items:flex-end; flex-wrap:wrap; padding:0 8px; z-index:46; }
  .helperChip{ width:58px; min-height:64px; background:var(--color-white); border-radius:var(--radius-md); border:none; box-shadow:var(--shadow-soft); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; cursor:grab; padding:4px 2px; touch-action:none; transition:transform var(--dur-fast) var(--ease-out); }
  .helperChip img{ width:42px; height:42px; pointer-events:none; }
  .chipName{ font-family:var(--font-body); font-weight:800; font-size:11px; color:var(--text-muted); line-height:1; pointer-events:none; }
  .helperChip.used{ opacity:.32; cursor:default; }
  .pullBtn{ font-family:var(--font-display); font-size:22px; font-weight:800; color:var(--text-on-color); background:var(--color-tangerine); border:none; border-radius:var(--radius-pill); padding:11px 24px; box-shadow:0 var(--chunk-depth) 0 var(--color-tangerine-deep); cursor:pointer; align-self:center; transition:transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out); }
  .pullBtn:active{ transform:translateY(4px); box-shadow:0 var(--chunk-depth-press) 0 var(--color-tangerine-deep); }

  /* shared drag ghost (basket packing + radish helpers) */
  .dragGhost{ position:fixed; z-index:200; pointer-events:none; filter:drop-shadow(0 8px 8px var(--tint-ink)); line-height:1; text-align:center; }
  .dragGhost img{ width:100%; height:auto; display:block; }

  /* ===== Red Riding Hood — kitchen (drag & drop) ===== */
  .kitchenCounter{ position:fixed; left:0; right:0; bottom:0; height:26%; background:#D9A066; box-shadow:inset 0 8px 0 #C4894E; z-index:2; }
  .kitchenShelf{ position:fixed; left:6%; right:6%; height:10px; border-radius:6px; background:#C4894E; z-index:3; }
  .kitchenItem{ position:absolute; line-height:1; cursor:grab; touch-action:none; z-index:8; filter:drop-shadow(0 4px 4px var(--tint-ink)); user-select:none; }
  .packList{ position:fixed; top:62px; left:50%; transform:translateX(-50%); z-index:45; background:var(--color-white); border-radius:var(--radius-lg); box-shadow:var(--shadow-soft); padding:8px 14px; display:flex; gap:14px; align-items:center; max-width:94vw; flex-wrap:wrap; justify-content:center; }
  .packItem{ display:flex; flex-direction:column; align-items:center; gap:2px; font-family:var(--font-body); font-weight:800; font-size:12px; color:var(--text-body); position:relative; }
  .packItem .ic{ font-size:30px; line-height:1; }
  .packItem.done{ opacity:.45; }
  .packItem.done::after{ content:"✓"; position:absolute; top:-4px; right:-6px; color:var(--color-grass); font-size:20px; font-weight:900; }

  /* ===== Red Riding Hood — maze ===== */
  .mazeCell{ position:absolute; background:var(--color-white); border-radius:14px; box-shadow:inset 0 -4px 0 rgba(0,0,0,.06); z-index:4; }
  .mazeLink{ position:absolute; background:var(--color-white); z-index:4; }
  .mazeArrow{ position:absolute; z-index:20; width:54px; height:54px; border-radius:50%; background:var(--color-grape); color:#fff; border:none; font-size:26px; display:flex; align-items:center; justify-content:center; box-shadow:0 var(--chunk-depth) 0 var(--color-grape-deep); cursor:pointer; touch-action:none; animation:cpulse 1.1s ease-in-out infinite; }
  .mazeArrow:active{ transform:translateY(4px); box-shadow:0 var(--chunk-depth-press) 0 var(--color-grape-deep); }
</style>

</head>
<body>
<div id="app">

  <!-- GATE (shown until a valid profile is entered) -->
  <div id="gate" class="screen">
    <div class="gateCard">
      <div class="gateHero"><img src="img/rex-dino.svg" alt=""><img src="img/mascot-boxy.svg" alt=""></div>
      <p class="eyebrow">WELCOME TO PLAYBOX</p><h1 class="gateTitle">Hello, little explorer.</h1>
      <p class="gateSub">A little world of play, just for you.</p>
      <input id="gateName" type="text" aria-label="Your nickname" maxlength="24" inputmode="text" autocomplete="off" autocapitalize="words" placeholder="Your nickname" />
      <p class="gate-note">Your name makes this little world yours.</p><button id="gateGo" data-native="true" class="gateBtn">Let's Play! ▶</button>
      <div id="gateErr" class="gateErr" role="alert"></div>
    </div>
  </div>

  <div id="topbar">
    <button id="backBtn">⟵ Home</button>
    <div id="score">⭐ 0</div>
    <button id="soundBtn">🔊</button>
  </div>

  <!-- HOME -->
  <div id="home" class="screen hidden">
    <div class="decor" aria-hidden="true"><img src="img/spot-cloud.svg" class="d1" alt=""><img src="img/spot-star.svg" class="d2" alt=""><img src="img/spot-rainbow.svg" class="d3" alt=""></div>
    <div class="big"><img src="img/rex-dino.svg" alt=""><img src="img/mascot-boxy.svg" alt=""></div>
    <h1 id="homeTitle">Playbox</h1>
    <div id="homeSub">Pick a box to play!</div>
    <div id="menu">
      <button class="menu-btn t-sky" data-mode="houses"><span class="emo">🏡</span>Hello, Neighbour!</button>
      <button class="menu-btn t-grape" data-mode="friends"><span class="emo">🔎</span>Match It</button>
      <button class="menu-btn t-coral" data-mode="balloons"><span class="emo"><img src="img/balloon-red.svg" alt=""></span>Pop Balloons</button>
      <button class="menu-btn t-bubblegum" data-mode="feed"><span class="emo"><img src="img/hop-bunny.svg" alt=""></span>Feed Bunny</button>
      <button class="menu-btn t-sunshine" data-mode="stars"><span class="emo"><img src="img/spot-star.svg" alt=""></span>Catch Stars</button>
      <button class="menu-btn t-teal" data-mode="eggs"><span class="emo">🥚</span>Dino Eggs</button>

<script>
(function () {

  let NAME = 'Avalynn';

  }

  // ---- content pools ----
  // Match It "friends" — brand art filenames (in img/). Compared by filename string.
  const FRIENDS = ['friend-cat.png','friend-dog.png','friend-butterfly.png','friend-flower.png','friend-chick.png','friend-turtle.png','friend-fox.png','rex-dino.svg','hop-bunny.svg','pip-pig.svg'];
  const imgOf = f => '<img src="img/'+f+'" alt="">';
  const SPARKS  = ['✨','💖','⭐','🌟','💕','🌸'];
  // Dinosaur art filenames in img/ (add more here as new dino art is dropped in — see ASSETS.md)
  const DINOS   = ['rex-dino.svg','dino-triceratops.png','dino-stegosaurus.png','dino-brontosaurus.png','dino-pterodactyl.png','dino-velociraptor.png','dino-ankylosaurus.png','dino-parasaurolophus.png','dino-spinosaurus.png','dino-hatchling.png'];

  const DINO_NAMES={'rex-dino.svg':'T rex','dino-hatchling.png':'baby dino'};

  let score = 0;
  let mode = null;
  let soundOn = Playbox.settings.sound;
  let audioCtx = null;
  let timers = [];
  let listeners = [];

  // ---------- audio ----------
  function initAudio() {}
  function makeWav(segs){ const rate=11025; let total=0; segs.forEach(s=>total+=Math.floor(rate*s.ms/1000)); const buf=new Uint8Array(44+total*2), dv=new DataView(buf.buffer); const w=(o,str)=>{for(let i=0;i<str.length;i++)dv.setUint8(o+i,str.charCodeAt(i));}; w(0,'RIFF');dv.setUint32(4,36+total*2,true);w(8,'WAVE');w(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,rate,true);dv.setUint32(28,rate*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);w(36,'data');dv.setUint32(40,total*2,true); let off=44; segs.forEach(s=>{const n=Math.floor(rate*s.ms/1000); for(let i=0;i<n;i++){const env=Math.min(1,i/(rate*0.01))*Math.min(1,(n-i)/(rate*0.05)); const v=Math.sin(2*Math.PI*s.f*i/rate)*0.5*env; dv.setInt16(off,v*32767,true); off+=2;}}); let bin=''; for(let i=0;i<buf.length;i++)bin+=String.fromCharCode(buf[i]); return 'data:audio/wav;base64,'+btoa(bin); }
  const SND={ good:makeWav([{f:523,ms:90},{f:659,ms:90},{f:784,ms:170}]), wrong:makeWav([{f:300,ms:130},{f:200,ms:170}]), tap:makeWav([{f:880,ms:70}]) };
  const _sfxPool=[]; let _sfxIdx=0;
  function playSnd(uri,vol){ if(!soundOn) return; try{ let a=_sfxPool[_sfxIdx]; if(!a){ a=new Audio(); _sfxPool[_sfxIdx]=a; } _sfxIdx=(_sfxIdx+1)%6; a.src=uri; a.volume=vol==null?1:vol; try{a.currentTime=0;}catch(e){} const p=a.play(); if(p&&p.catch)p.catch(()=>{}); }catch(e){} }
  function chime(base) { playSnd(SND.good); }
  function ttsSay(text) {
    if (!soundOn || !('speechSynthesis' in window)) return;
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.95; u.pitch = 1.4; u.volume = 1;
      const vs = speechSynthesis.getVoices();
      const pref = vs.find(v=>/female|samantha|karen|zira|google uk english female|tessa/i.test(v.name))
                 || vs.find(v=>/en/i.test(v.lang));
      if (pref) u.voice = pref;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    } catch(e) {}
  }
  function slugify(t){ return t.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,''); }
  function say(text){ Playbox.audio.play(Playbox.arcadePhrase(text,NAME)); }

  // ---- mobile audio unlock (Chrome/Safari require a user gesture) ----
  let _audioPrimed = false;

    }
  }
  document.addEventListener('pointerdown', ensureAudio, true);

  // ---------- helpers ----------
  function rnd(a,b){ return Math.random()*(b-a)+a; }

  function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  function setScore(n){ score=Math.max(0,n); scoreEl.textContent='⭐ '+score; }
  function bonk(){ playSnd(SND.wrong,0.7); }
  function trackTimer(id){ timers.push(id); }
  function clearTimers(){ timers.forEach(t=>{clearTimeout(t);clearInterval(t);}); timers=[]; }

  function burst(x,y){
    for(let i=0;i<8;i++){
      const s=document.createElement('div'); s.className='spark'; s.textContent=pick(SPARKS);

    const el=document.createElement('div'); el.className='cheer'; el.textContent=t;

  }

  // praise: counts, names Avalynn, says colors
  function reward(opts){
    opts = opts || {};
    chime(opts.base);
    const visual = opts.count ? String(score) : pick(CHEERS);
    cheerText(visual);
    // spoken: balloon color name, otherwise a cheer (bounded clip set)
    say(opts.color ? opts.color : pick(CHEERS));
  }

  function applyScene(i){
    const s = SCENES[i % SCENES.length];
    app.style.background = s.bg;
    let lbl = document.querySelector('.scene-label');
    if(!lbl){ lbl=document.createElement('div'); lbl.className='scene-label'; document.body.appendChild(lbl); }
    lbl.textContent = s.name;
  }

  // ---------- MODE: Match It (tap the matching items) ----------
  function spawnMatchItem(emo, target, onMatch){
    const c=document.createElement('div'); c.className='critter'; c.innerHTML=imgOf(emo);
    const size=rnd(74,108); c.style.fontSize=size+'px';
    c.style.left=rnd(10,Math.max(10,window.innerWidth-size))+'px';
    c.style.top =rnd(140,Math.max(160,window.innerHeight-size-20))+'px';
    let t=Math.random()*6;
    function drift(){ if(!c.isConnected||c.classList.contains('pop'))return;
      t+=0.03; c.style.transform='translateY('+Math.sin(t)*10+'px)'; requestAnimationFrame(drift); }
    requestAnimationFrame(drift);
    c.addEventListener('pointerdown',e=>{
      e.preventDefault(); e.stopPropagation();
      if(c.classList.contains('pop')||c.classList.contains('shake'))return;
      if(emo===target){
        const r=c.getBoundingClientRect();
        burst(r.left+r.width/2, r.top+r.height/2);
        setScore(score+1); reward({count:true});
        c.classList.add('pop');
        c.addEventListener('animationend',()=>{ c.remove(); onMatch(); },{once:true});
      } else {
        bonk(); say(pick(['Not that one','Try again','Look again']));
        c.classList.add('shake');
        c.addEventListener('animationend',()=>c.classList.remove('shake'),{once:true});
      }
    });
    play.appendChild(c);
  }
  function newMatchRound(){
    play.innerHTML='';
    const target=pick(FRIENDS);
    const banner=document.createElement('div'); banner.className='match-banner';
    banner.innerHTML='Tap all the <span class="big">'+imgOf(target)+'</span>';
    play.appendChild(banner);
    const others=shuffle(FRIENDS.filter(f=>f!==target));
    const matchCount=2+Math.floor(Math.random()*2);   // 2-3 to find
    const distractCount=3+Math.floor(Math.random()*3); // 3-5 others
    const items=[]; for(let i=0;i<matchCount;i++) items.push(target);
    for(let i=0;i<distractCount;i++) items.push(others[i%others.length]);
    let remaining=matchCount;
    shuffle(items).forEach(emo=>spawnMatchItem(emo,target,()=>{
      remaining--;
      if(remaining<=0){ cheerText(pick(CHEERS)); applyScene((score/6)|0); const t=Playbox.session.timeout(newMatchRound,800); trackTimer(t); }
    }));
  }
  function startFriends(){ applyScene(0); newMatchRound(); say('Tap all the ones that are the same, '+NAME+'!'); }

  // ---------- MODE: Pop Balloons ----------
  // Color challenge: every few pops the game asks for a specific color ("Can you pop the
  // pink balloon?"). Finding it earns a bonus star; wrong-color pops still count (no
  // punishment at age 3). Spawner guarantees the asked color stays on screen.
  let balloonChallenge=null, balloonPops=0;
  function setBalloonChallenge(){
    const onscreen=[...play.querySelectorAll('.critter[data-color]:not(.pop)')].map(b=>b.dataset.color);
    if(!onscreen.length) return;

    say('Can you pop the '+balloonChallenge+' balloon?');

  function spawnBalloon(){
    let col=pick(BALLOON_COLORS);
    if(balloonChallenge && !play.querySelector('.critter[data-color="'+balloonChallenge+'"]:not(.pop)')){
      col=BALLOON_COLORS.find(c=>c.name===balloonChallenge)||col;

    b.dataset.color=col.name;

    let y=window.innerHeight; const speed=rnd(0.8,1.8);

      y-=speed; b.style.top=y+'px';
      b.style.transform='translateX('+Math.sin(y/40)*14+'px)';

    },16); trackTimer(id);
    b.addEventListener('pointerdown',e=>{
      e.preventDefault(); e.stopPropagation();
      if(b.classList.contains('pop'))return;
      clearInterval(id);
      const r=b.getBoundingClientRect();
      burst(r.left+r.width/2,r.top+r.height/2);
      setScore(score+1);
      balloonPops++;
      if(balloonChallenge && b.dataset.color===balloonChallenge){
        balloonChallenge=null; balloonPops=0;

        reward({color:b.dataset.color});
        if(!balloonChallenge && balloonPops>=5){ balloonPops=0; const t=Playbox.session.timeout(setBalloonChallenge,900); trackTimer(t); }
      }
      b.classList.add('pop');
      b.addEventListener('animationend',()=>{b.remove(); spawnBalloon();},{once:true});
    });
  }
  function startBalloons(){ applyScene(3); balloonChallenge=null; balloonPops=0; for(let i=0;i<4;i++){ const t=Playbox.session.timeout(spawnBalloon,i*500); trackTimer(t);} say('Pop the balloons, '+NAME+'!'); }

  // ---------- MODE: Feed Bunny ----------

  // ---------- MODE: Catch Stars (catch stars, avoid rocks, don't let stars drop!) ----------
  function startStars(){
    applyScene(2);
    const STAR=['spot-star.svg','star-pink.svg','star-sky.svg','star-grape.svg'];
    const BAD=['rock.png','bomb.png','spot-cloud.svg'];
    function spawnFalling(){
      const isStar=Math.random()<0.68;
      const e=isStar?pick(STAR):pick(BAD);
      const s=document.createElement('div'); s.className='critter'; s.innerHTML=imgOf(e);
      const size=rnd(64,104); s.style.fontSize=size+'px';

      s.style.left=x+'px'; let y=-size; s.style.top=y+'px';

      },16); trackTimer(id);

        ev.preventDefault(); ev.stopPropagation();

        s.addEventListener('animationend',()=>s.remove(),{once:true});

  // ---------- MODE: Dino Dig (brush away dirt to reveal a dinosaur) ----------
  function startDig(){
    applyScene(0);
    play.innerHTML='';
    const wrap=document.createElement('div'); wrap.id='digWrap';
    const buried=pick(DINOS.concat(FOSSILS));
    const dino=document.createElement('div'); dino.className='digDino'; dino.innerHTML=imgOf(buried);
    const cv=document.createElement('canvas'); cv.id='digCanvas';
    const hint=document.createElement('div'); hint.className='digHint'; hint.textContent='👆 Rub to dig!';
    wrap.appendChild(dino); wrap.appendChild(cv); wrap.appendChild(hint);
    play.appendChild(wrap);
    let digDone=false, digActive=null, lastP=null, lastEval=0, lastBlip=0;
    function setup(){
      const rect=cv.getBoundingClientRect(); if(rect.width<10) return;
      if(cv.width>300 && cv.dataset.ready==='1') return;
      const dpr=window.devicePixelRatio||1; cv.width=rect.width*dpr; cv.height=rect.height*dpr; cv.dataset.ready='1';
      const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.clearRect(0,0,rect.width,rect.height);
      ctx.fillStyle='#b07a4f'; ctx.fillRect(0,0,rect.width,rect.height);
      ctx.fillStyle='rgba(90,60,35,.45)';
      for(let i=0;i<150;i++){ const x=Math.random()*rect.width, y=Math.random()*rect.height, r=Math.random()*6+2; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
      function pos(e){ return {x:e.clientX-rect.left, y:e.clientY-rect.top}; }   // reuse cached rect (no per-move layout read)
      function scratch(a,b){ ctx.globalCompositeOperation='destination-out'; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=58;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        ctx.beginPath(); ctx.arc(b.x,b.y,29,0,7); ctx.fill(); ctx.globalCompositeOperation='source-over'; }
      // cleared-fraction check via a tiny downscale (reads ~6KB, not the full ~3MB canvas → no per-move stall)
      const smallCv=document.createElement('canvas'); smallCv.width=40; smallCv.height=40;
      const smallCx=smallCv.getContext('2d',{willReadFrequently:true});
      function evalDig(){
        if(digDone) return;
        smallCx.clearRect(0,0,40,40); smallCx.drawImage(cv,0,0,40,40);
        let img; try{ img=smallCx.getImageData(0,0,40,40).data; }catch(e){ return; }
        let clear=0; const tot=40*40;
        for(let i=3;i<img.length;i+=4){ if(img[i]<40) clear++; }
        if(clear/tot>=0.5) finishDig();
      }
      function finishDig(){
        if(digDone) return; digDone=true;
        ctx.clearRect(0,0,rect.width,rect.height); const h=wrap.querySelector('.digHint'); if(h) h.remove();
        dino.classList.add('reveal');
        setScore(score+1); chime();
        const r=wrap.getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2);
        cheerText('You found a dinosaur! 🦴');
        say(FOSSILS.includes(buried) ? 'You found a fossil' : 'You found '+withArticle(dinoName(buried)));
        const t=Playbox.session.timeout(()=>{ if(mode==='dig') startDig(); }, 1900); trackTimer(t);
      }
      cv.onpointerdown=e=>{ if(digActive!==null) return; e.preventDefault(); digActive=e.pointerId; try{cv.setPointerCapture(e.pointerId);}catch(_){}; lastP=pos(e); scratch(lastP,lastP); };
      cv.onpointermove=e=>{ if(e.pointerId!==digActive) return; e.preventDefault(); const p=pos(e); scratch(lastP||p,p); lastP=p; const now=Date.now(); if(now-lastBlip>120){ lastBlip=now; playSnd(SND.tap,0.18); } if(now-lastEval>320){ lastEval=now; evalDig(); } };
      cv.onpointerup=e=>{ if(e.pointerId!==digActive) return; digActive=null; lastP=null; evalDig(); };
      cv.onpointercancel=e=>{ if(e.pointerId===digActive){ digActive=null; lastP=null; } };
    }
    Playbox.session.timeout(setup,40);
    Playbox.session.timeout(()=>{ if(cv.dataset.ready!=='1') setup(); },300);
    say('Dig up the dinosaur, '+NAME+'!');
  }

  // ---------- MODE: Draw (free drawing with crayons + stamps) ----------
  function startDraw(){
    applyScene(4);
    play.innerHTML='';
    const wrap=document.createElement('div'); wrap.id='drawWrap';
    const cv=document.createElement('canvas'); cv.id='drawCanvas';
    wrap.appendChild(cv); play.appendChild(wrap);
    const bar=document.createElement('div'); bar.id='drawBar'; play.appendChild(bar);
    // kid color words (clips exist), toy-palette hexes (canvas needs literals)
    const CRAYONS=[['red','#FF6B6B'],['orange','#FF924C'],['yellow','#FFC93C'],['green','#5FC97B'],['blue','#45ADE8'],['purple','#9B5DE5'],['pink','#FF8FB1'],['brown','#8B5E3C'],['black','#43352F']];
    const STAMPS=[['cat','friend-cat.png'],['dog','friend-dog.png'],['butterfly','friend-butterfly.png'],['bunny','hop-bunny.svg'],['dinosaur','rex-dino.svg'],['star','spot-star.svg']];
    let tool={type:'pen', color:CRAYONS[4][1]};   // start with blue
    let ctx=null, rect=null, cw=0, chh=0, active=null, last=null;
    const history=[];
    function remember(){ if(!ctx) return; history.push(ctx.getImageData(0,0,cv.width,cv.height)); if(history.length>4) history.shift(); }
    const stampImgs={};
    STAMPS.forEach(s=>{ const im=new Image(); im.src='img/'+s[1]; stampImgs[s[0]]=im; });
    function setup(){
      const r=cv.getBoundingClientRect(); if(r.width<10||cv.dataset.ready==='1') return;
      const dpr=window.devicePixelRatio||1; cv.width=r.width*dpr; cv.height=r.height*dpr; cv.dataset.ready='1';
      cw=r.width; chh=r.height;
      ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,cw,chh);
      ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=16;
    }
    cv.onpointerdown=e=>{
      if(active!==null||!ctx) return; e.preventDefault(); active=e.pointerId;
      try{cv.setPointerCapture(e.pointerId);}catch(_){}
      rect=cv.getBoundingClientRect();   // cached once per stroke (no per-move layout read)
      remember();
      const p={x:e.clientX-rect.left, y:e.clientY-rect.top};
      if(tool.type==='stamp'){
        const im=stampImgs[tool.name];
        if(im&&im.complete&&im.naturalWidth){ ctx.drawImage(im,p.x-45,p.y-45,90,90); playSnd(SND.tap,0.5); }
      } else {
        ctx.fillStyle=tool.color; ctx.beginPath(); ctx.arc(p.x,p.y,8,0,7); ctx.fill(); last=p;
      }
    };
    cv.onpointermove=e=>{
      if(e.pointerId!==active||tool.type!=='pen'||!last) return; e.preventDefault();
      const p={x:e.clientX-rect.left, y:e.clientY-rect.top};
      ctx.strokeStyle=tool.color; ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p;
    };
    cv.onpointerup=e=>{ if(e.pointerId===active){ active=null; last=null; } };
    cv.onpointercancel=cv.onpointerup;
    CRAYONS.forEach(c=>{
      const b=document.createElement('button'); b.className='crayon'; b.style.background=c[1];
      if(c[1]===tool.color) b.classList.add('sel');
      b.addEventListener('pointerdown',e=>{ e.preventDefault();
        tool={type:'pen',color:c[1]};
        bar.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
        say(c[0]); });
      bar.appendChild(b);
    });
    STAMPS.forEach(s=>{
      const b=document.createElement('button'); b.className='stampBtn'; b.innerHTML=imgOf(s[1]); b.setAttribute('aria-label',s[0]+' stamp');
      b.addEventListener('pointerdown',e=>{ e.preventDefault();
        tool={type:'stamp',name:s[0]};
        bar.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
        say(s[0]); });
      bar.appendChild(b);
    });
    const undo=document.createElement('button'); undo.className='stampBtn'; undo.textContent='↶'; undo.setAttribute('aria-label','Undo last mark'); undo.addEventListener('pointerdown',e=>{e.preventDefault(); if(ctx && history.length) ctx.putImageData(history.pop(),0,0);}); bar.appendChild(undo);
    const clr=document.createElement('button'); clr.className='stampBtn'; clr.textContent='🧽'; clr.setAttribute('aria-label','Clear drawing');
    clr.addEventListener('pointerdown',e=>{ e.preventDefault(); if(!ctx) return; remember();
      ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,cw,chh); playSnd(SND.tap,0.5); });
    bar.appendChild(clr);
    Playbox.session.timeout(setup,40);
    Playbox.session.timeout(()=>{ if(cv.dataset.ready!=='1') setup(); },300);
    say('Draw a picture, '+NAME+'!');
  }

  const TARDI_HOMES=[
    {who:'Gavin', img:'tardi-gavin.svg', ball:'tardi-gavin-ball.svg', bg:'var(--color-coral-soft)',  label:'🌋 Hot Volcano', intro:'Gavin lives in a hot volcano.',  winLine:'Too hot for the spider!',    fx:['🔥','☀️','💥','🌋']},

    say('Help the three little tardigrades, '+NAME+'!');

  function tardiHome(i){
    if(mode!=='tardi') return;
    if(i>=TARDI_HOMES.length){ tardiFinale(); return; }
    const h=TARDI_HOMES[i];
    play.innerHTML=''; app.style.background=h.bg; tardiLabel(h.label);
    const size=150;
    const tx=window.innerWidth/2-size/2, ty=window.innerHeight*0.52-size/2;
    const tardi=document.createElement('div'); tardi.className='critter'; tardi.innerHTML=imgOf(h.img);
    tardi.style.fontSize=size+'px'; tardi.style.left=tx+'px'; tardi.style.top=ty+'px';
    play.appendChild(tardi);
    let bob=Math.random()*6;
    function drift(){ if(!tardi.isConnected) return; bob+=0.03; tardi.style.transform='translateY('+Math.sin(bob)*8+'px)'; requestAnimationFrame(drift); }
    requestAnimationFrame(drift);
    say(h.intro);
    let tucked=false, spider=null, sx=0, sdir=1;
    const t=Playbox.session.timeout(spawnSpider, 3000); trackTimer(t);
    function spawnSpider(){
      if(mode!=='tardi'||tucked) return;
      sdir = Math.random()<0.5 ? 1 : -1;                    // 1 = enters from the left
      spider=document.createElement('div'); spider.className='critter'; spider.innerHTML=imgOf('spider-wolf.svg');
      const ssize=120; spider.style.fontSize=ssize+'px';
      sx = sdir===1 ? -ssize : window.innerWidth;
      spider.style.left=sx+'px'; spider.style.top=(ty+10)+'px';
      play.appendChild(spider);
      say('Here comes the big hairy wolf spider! Tap '+h.who+'!');
      const banner=document.createElement('div'); banner.className='match-banner';
      banner.innerHTML='Tap <b>'+h.who+'</b>! <span class="big">'+imgOf(h.img)+'</span>';
      play.appendChild(banner);
      const stopAt = sdir===1 ? tx-140 : tx+size+20;        // creep up to the tardigrade, then wait
      const id=Playbox.session.interval(()=>{
        if(mode!=='tardi'||!spider.isConnected||tucked){ clearInterval(id); return; }
        if((sdir===1&&sx<stopAt)||(sdir===-1&&sx>stopAt)){ sx+=sdir*1.3; spider.style.left=sx+'px'; }
        spider.style.transform='translateY('+Math.sin(Date.now()/300)*6+'px)';
      },16); trackTimer(id);
      spider.addEventListener('pointerdown',e=>{
        e.preventDefault(); e.stopPropagation();
        if(tucked) return;
        bonk(); say('Not that one');
        spider.classList.add('shake');
        spider.addEventListener('animationend',()=>spider.classList.remove('shake'),{once:true});

      const t1=Playbox.session.timeout(()=>{
        if(mode!=='tardi') return;
        tardiFx(h.fx); say(h.winLine); cheerText(h.winLine); setScore(score+1);
        if(spider&&spider.isConnected){                      // spider flees the way it came

            if(!spider.isConnected){ clearInterval(id); return; }
            sx-=sdir*16; spider.style.left=sx+'px';
            spider.style.transform='rotate('+(sdir*-18)+'deg) scaleX('+(-sdir)+')';
            if(sx<-200||sx>window.innerWidth+200){ clearInterval(id); spider.remove(); }
          },16); trackTimer(id);
        }
      }, 500); trackTimer(t1);
      const t2=Playbox.session.timeout(()=>{ if(mode!=='tardi') return; tardi.innerHTML=imgOf(h.img); }, 2600); trackTimer(t2);
      const t3=Playbox.session.timeout(()=>tardiHome(i+1), 3600); trackTimer(t3);
    });

  function tardiFinale(){

    play.innerHTML=''; app.style.background='var(--color-bubblegum-soft)'; tardiLabel('💖 New Friends');
    const ssize=150;
    const spider=document.createElement('div'); spider.className='critter'; spider.innerHTML=imgOf('spider-wolf.svg');
    spider.style.fontSize=ssize+'px';
    spider.style.left=(window.innerWidth/2-ssize/2)+'px'; spider.style.top=(window.innerHeight*0.48-ssize/2)+'px';

    tear.style.left=(window.innerWidth/2+ssize/2-20)+'px'; tear.style.top=(window.innerHeight*0.48-ssize/2+30)+'px';

    say('The spider is just lonely. Tap the spider to be his friend!');
    const banner=document.createElement('div'); banner.className='match-banner';
    banner.innerHTML='Tap the spider! <span class="big">'+imgOf('spider-wolf.svg')+'</span>';
    play.appendChild(banner);
    let done=false;
    spider.addEventListener('pointerdown',e=>{
      e.preventDefault(); e.stopPropagation();
      if(done) return; done=true;
      tear.remove(); banner.remove();
      chime(); setScore(score+3);
      const r=spider.getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2);
      tardiFx(['💖','💕','💗','🌸']);

  // ---------- shared drag & drop (basket packing + radish helpers) ----------
  // Single active pointer only (palm-proof); a floating ghost follows the finger; onDrop
  // gets (clientX, clientY, moved). A short tap (moved=false) is accepted too, so a child
  // who taps instead of drags still succeeds. No work on pointermove beyond moving the ghost.
  let _dragging=false;
  function startDrag(srcEl, sx, sy, html, size, pointerId, onDrop){
    if(_dragging) return; _dragging=true;
    if(srcEl) srcEl.style.visibility='hidden';
    const g=document.createElement('div'); g.className='dragGhost'; g.innerHTML=html;
    g.style.width=size+'px'; g.style.fontSize=size+'px';
    g.style.left=(sx-size/2)+'px'; g.style.top=(sy-size/2)+'px';
    document.body.appendChild(g);
    let moved=false;
    function mv(ev){ if(ev.pointerId!==pointerId) return; const dx=ev.clientX-sx, dy=ev.clientY-sy; if(dx*dx+dy*dy>144) moved=true; g.style.left=(ev.clientX-size/2)+'px'; g.style.top=(ev.clientY-size/2)+'px'; }
    function up(ev){
      if(ev.pointerId!==pointerId) return;
      cleanup();
      const ok=onDrop(ev.clientX, ev.clientY, moved);
      if(srcEl && !ok) srcEl.style.visibility='';
    }
    function cleanup(){ window.removeEventListener('pointermove',mv,true); window.removeEventListener('pointerup',up,true); window.removeEventListener('pointercancel',cancel,true); g.remove(); _dragging=false; window.cancelPlayboxDrag=null; }
    function cancel(ev){ if(ev && ev.pointerId!==pointerId) return; cleanup(); if(srcEl) srcEl.style.visibility=''; }
    window.cancelPlayboxDrag=()=>cancel();
    window.addEventListener('pointercancel',cancel,true);
    window.addEventListener('pointermove',mv,true); window.addEventListener('pointerup',up,true);
  }

  // ---------- MODE: 拔萝卜 Pull the Radish (Chinese-voiced arithmetic story game) ----------
  // A giant radish needs exactly the answer to a small +/- problem in helpers to pull out.
  // Drag helper characters onto the field to add them (a tap works too); tap a placed helper
  // to send it back. Then Pull. Too few → wiggle + "add more"; too many → giggly tumble +
  // retry (never injured). Numbers grow adaptively. Voice is zh-CN-Xiaoxiao clips played by key.
  // The equation pools below MUST stay identical to R_ADD / R_SUB in generate_voice.py.
  const R_ADD=[[1,1],[2,1],[1,2],[2,2],[3,1],[1,3],[3,2],[2,3],[4,1],[1,4],[4,2],[3,3],[5,1]];
  const R_SUB=[[3,1],[4,1],[4,2],[5,1],[5,2],[5,3],[6,2],[6,1],[6,3]];
  const RADISH_EQ=[];
  R_ADD.forEach(p=>RADISH_EQ.push({a:p[0],b:p[1],op:'+',ans:p[0]+p[1],key:'zh_eq_'+p[0]+'_plus_'+p[1]}));
  R_SUB.forEach(p=>RADISH_EQ.push({a:p[0],b:p[1],op:'-',ans:p[0]-p[1],key:'zh_eq_'+p[0]+'_minus_'+p[1]}));
  // roster: {file, name} — names shown as labels (fun mascot names), never spoken here.
  const RADISH_HELPERS=[
    {file:'grandma.svg',name:'Grandma'},{file:'hop-bunny.svg',name:'Hop'},{file:'rex-dino.svg',name:'Rex'},
    {file:'pip-pig.svg',name:'Pip'},{file:'pig-pop.svg',name:'Pop'},{file:'pig-pudge.svg',name:'Pudge'},
    {file:'red-riding-hood.svg',name:'Red'},{file:'goat.svg',name:'Billy'},{file:'girl.svg',name:'Lily'},
    {file:'unicorn.svg',name:'Sparkle'},{file:'wolf-big.svg',name:'Wolfie'},{file:'dino-trixie.svg',name:'Trixie'},
    {file:'shark.svg',name:'Finn'},{file:'polar-bear.svg',name:'Snowy'}
  ];
  let radishStreak=0, radishTeam=[], radishEq=null, radishTries=0, radishBusy=false;

  function startRadish(){
    radishStreak=0;
    sayKey('zh_intro');
    const t=Playbox.session.timeout(radishRound, 2200); trackTimer(t);
  }
  function radishRound(){
    if(mode!=='radish') return;
    radishBusy=false; radishTeam=[]; radishTries=0;
    play.innerHTML=''; app.style.background='var(--color-grass-soft)';
    const _lbl=document.querySelector('.scene-label'); if(_lbl) _lbl.remove();   // tray owns the bottom here
    const maxAns=3+Math.min(3,Math.floor(radishStreak/2));   // 3 → 6 as the child succeeds
    const pool=RADISH_EQ.filter(e=> e.ans<=maxAns && (e.op==='+' || maxAns>=4));
    radishEq=pick(pool);
    buildRadishScene();
    const t=Playbox.session.timeout(()=>{ if(mode==='radish') sayKey(radishEq.key); }, 500); trackTimer(t);
  }
  function radishGeo(){
    const W=window.innerWidth, H=window.innerHeight;
    const Rw=Math.min(W*0.30,175);
    const rx=W*0.66, ry=H*0.24;                 // radish top-left
    const handY=ry+Rw*0.42;
    return {W,H,Rw,rx,ry,handY};
  }
  function buildRadishScene(){
    const g=radishGeo();
    // mound + radish
    const mound=document.createElement('div'); mound.className='radishMound';
    mound.style.width=(g.Rw*1.1)+'px'; mound.style.height=(g.Rw*0.34)+'px';
    mound.style.left=(g.rx+g.Rw*0.5-g.Rw*0.55)+'px'; mound.style.top=(g.ry+g.Rw*0.82)+'px';
    play.appendChild(mound);
    const radish=document.createElement('div'); radish.className='radishBig'; radish.id='radishBig'; radish.innerHTML=imgOf('radish.svg');
    radish.style.width=g.Rw+'px'; radish.style.left=g.rx+'px'; radish.style.top=g.ry+'px';
    play.appendChild(radish);
    // rope from radish toward the left where helpers pull
    const rope=document.createElement('div'); rope.className='radishRope'; rope.id='radishRope';
    const ropeLen=g.rx-8; rope.style.left='8px'; rope.style.top=g.handY+'px'; rope.style.width=ropeLen+'px';
    play.appendChild(rope);
    // helper container
    const hc=document.createElement('div'); hc.id='radishHelpers'; play.appendChild(hc);
    // equation sign
    const sign=document.createElement('div'); sign.className='eqSign'; sign.id='eqSign';
    const dotsAdd = '<span class="grp">'+'<span class="dot"></span>'.repeat(radishEq.a)+'</span>'
      + (radishEq.op==='+' ? '<span>+</span><span class="grp">'+'<span class="dot"></span>'.repeat(radishEq.b)+'</span>' : '');
    let dotsHtml;
    if(radishEq.op==='+'){ dotsHtml=dotsAdd; }
    else { // a dots, last b greyed out
      let s='<span class="grp">';
      for(let i=0;i<radishEq.a;i++){ s+='<span class="dot'+(i>=radishEq.a-radishEq.b?' off':'')+'"></span>'; }
      s+='</span>'; dotsHtml=s;
    }
    sign.innerHTML=
      '<div class="eqRow"><span>'+radishEq.a+'</span><span>'+radishEq.op+'</span><span>'+radishEq.b+'</span><span>=</span><span class="q" id="eqAns">?</span></div>'
      +'<div class="eqDots">'+dotsHtml+'</div>'
      +'<div class="eqCount">Helpers: <b id="eqCount">0</b></div>';
    play.appendChild(sign);
    // tray: draggable helper chips + pull button
    const tray=document.createElement('div'); tray.id='radishTray';
    RADISH_HELPERS.forEach((hh,idx)=>{
      const chip=document.createElement('button'); chip.className='helperChip'; chip.dataset.idx=idx;
      chip.innerHTML=imgOf(hh.file)+'<span class="chipName">'+hh.name+'</span>';
      const hw=Math.min(radishGeo().W*0.17,118);
      chip.addEventListener('pointerdown',e=>{
        e.preventDefault(); e.stopPropagation();
        if(radishBusy || chip.classList.contains('used')) return;
        startDrag(chip, e.clientX, e.clientY, imgOf(hh.file), hw, e.pointerId, (x,y,moved)=>{
          if(!moved || y < window.innerHeight-118){          // dropped on the field (above the tray)
            radishTeam.push(idx); chip.classList.add('used'); chip.style.visibility='';
            chime(); sayKey('zh_'+radishTeam.length); renderRadishTeam();
            return true;
          }
          return false;                            // snap back
        });
      });
      tray.appendChild(chip);
    });
    const pull=document.createElement('button'); pull.className='pullBtn'; pull.textContent='拔萝卜! Pull!';
    pull.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); radishPull(); });
    tray.appendChild(pull);
    play.appendChild(tray);
    renderRadishTeam();
  }
  function radishUnuse(idx){ const c=play.querySelector('.helperChip[data-idx="'+idx+'"]'); if(c) c.classList.remove('used'); }
  function renderRadishTeam(){
    const hc=document.getElementById('radishHelpers'); if(!hc) return;
    const g=radishGeo();
    const hw=Math.min(g.W*0.17,118);
    const spacing=hw*0.62;
    hc.innerHTML='';
    radishTeam.forEach((idx,i)=>{
      const h=document.createElement('div'); h.className='radishHelper';
      h.innerHTML=imgOf(RADISH_HELPERS[idx].file)+'<span class="rhName">'+RADISH_HELPERS[idx].name+'</span>';
      h.style.width=hw+'px';
      h.style.left=Math.max(2,(g.rx-(i+1)*spacing))+'px';
      h.style.top=(g.handY-hw*0.55)+'px';
      h.addEventListener('pointerdown',e=>{           // tap a placed helper to send it back
        e.preventDefault(); e.stopPropagation();
        if(radishBusy) return;
        const pos=radishTeam.indexOf(idx); if(pos>=0) radishTeam.splice(pos,1);
        radishUnuse(idx); playSnd(SND.tap,0.4); renderRadishTeam();
      });
      hc.appendChild(h);
    });
    const c=document.getElementById('eqCount'); if(c) c.textContent=radishTeam.length;
  }
  function showRadishHint(){
    const ans=document.getElementById('eqAns'); if(ans){ ans.textContent=radishEq.ans; ans.classList.add('reveal'); }
    sayKey('zh_hint');
  }
  function radishPull(){
    if(mode!=='radish'||radishBusy) return;
    const n=radishTeam.length, ans=radishEq.ans;
    if(n===0){ bonk(); sayKey('zh_fewer'); return; }
    if(n===ans){
      radishBusy=true; chime(); setScore(score+3); radishStreak++;
      const r=document.getElementById('radishBig'); if(r) r.classList.add('radishPulled');
      const rr=document.getElementById('radishRope'); if(rr) rr.style.opacity='0';
      tardiFx(['🥕','✨','💪','🎉']);
      cheerText('🥕 拔出来啦!');
      sayKey('zh_win');
      const t=Playbox.session.timeout(()=>{ if(mode==='radish') radishRound(); }, 3400); trackTimer(t);
    } else if(n<ans){
      bonk(); sayKey('zh_fewer'); radishTries++;
      const r=document.getElementById('radishBig'); if(r){ r.classList.remove('radishWiggle'); void r.offsetWidth; r.classList.add('radishWiggle'); }
      if(radishTries>=2) showRadishHint();
    } else {
      bonk(); radishBusy=true; radishTries++; sayKey('zh_toomany');
      cheerText('😆 太多啦!');
      play.querySelectorAll('.radishHelper').forEach(h=>h.classList.add('helperTumble'));
      const t=Playbox.session.timeout(()=>{
        if(mode!=='radish') return;
        radishTeam=[]; renderRadishTeam();
        play.querySelectorAll('.helperChip.used').forEach(c=>c.classList.remove('used'));
        radishBusy=false;
        if(radishTries>=2) showRadishHint();
      }, 1000); trackTimer(t);
    }
  }

  // ---------- navigation ----------
  function goFullscreen() {} // Fullscreen is not requested automatically.
  function openMode(m){ Playbox.session.clear(); if(window.cancelPlayboxDrag) window.cancelPlayboxDrag(); play.classList.remove('neighbour-game'); window.dispatchEvent(new CustomEvent('playbox-activity',{detail:m}));
    goFullscreen();
    initAudio();
    mode=m; setScore(0);
    play.innerHTML='';
    home.classList.add('hidden');
    play.classList.remove('hidden');
    topbar.style.display='flex';
    if(m==='houses') startNeighbourhood({play,say,reward:()=>{setScore(score+1);reward();},home:goHome});
    else if(m==='friends') startFriends();
    else if(m==='balloons') startBalloons();
    else if(m==='feed') startFeed();
    else if(m==='stars') startStars();
    else if(m==='eggs') startEggs();
    else if(m==='dig') startDig();
    else if(m==='draw') startDraw();
    else if(m==='princess') startPrincess();
    else if(m==='tardi') startTardi();
    else if(m==='candy') startCandy();
    else if(m==='red') startRed();
    else if(m==='radish') startRadish();
  }
  function goHome(){ Playbox.session.clear(); if(window.cancelPlayboxDrag) window.cancelPlayboxDrag(); play.classList.remove('neighbour-game'); window.dispatchEvent(new CustomEvent('playbox-home'));
    clearTimers();
    if('speechSynthesis' in window) speechSynthesis.cancel();
    play.innerHTML='';
    play.classList.add('hidden');
    topbar.style.display='none';
    const lbl=document.querySelector('.scene-label'); if(lbl) lbl.remove();
    home.classList.remove('hidden');
    app.style.background='var(--surface-app)';
    mode=null;
  }

  document.querySelectorAll('.menu-btn').forEach(btn=>{
    btn.dataset.native='true'; btn.addEventListener('click',()=>openMode(btn.dataset.mode));
  });
  backBtn.addEventListener('pointerdown',e=>{ e.preventDefault(); goHome(); });
  soundBtn.addEventListener('pointerdown',e=>{
    e.preventDefault(); soundOn=!soundOn; Playbox.setSettings({sound:soundOn}); if(!soundOn) _sfxPool.forEach(a=>a.pause());
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
    if(soundOn) initAudio();
  });

  window.addEventListener('playbox-settings',()=>{ soundOn=Playbox.settings.sound; if(!soundOn) _sfxPool.forEach(a=>a.pause()); });
  Playbox.applySettings();
  // gate + profile wiring
  if(gateGo){ gateGo.addEventListener('click',e=>{ e.preventDefault(); submitGate(); }); }
  if(gateName){ gateName.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); submitGate(); } }); }
  if(profileBtn){ profileBtn.addEventListener('pointerdown',e=>{ e.preventDefault(); changeProfile(); }); }
  (function(){ const saved=loadProfile(); const p=Playbox.profile(saved && saved.full) || {full:'Avalynn',first:'Avalynn'}; saveProfile(p); applyProfile(p); })();

  // Warm the image cache once idle → smoother first play.
  (function(){
    const list=[...FRIENDS,...DINOS,...FOSSILS,'egg-spotted.png','egg-cracking.png','carrot.png','rock.png','bomb.png','spot-star.svg','star-pink.svg','star-sky.svg','star-grape.svg','spot-cloud.svg','spot-rainbow.svg','hop-bunny.svg','rex-dino.svg','mascot-boxy.svg',
      'tardi-trio.svg','spider-wolf.svg','tardi-gavin.svg','tardi-colin.svg','tardi-doug.svg','tardi-gavin-ball.svg','tardi-colin-ball.svg','tardi-doug-ball.svg',
      'candy-house.svg','candy-witch.svg','hansel-gretel.svg',
      'red-riding-hood.svg','wolf-kind.svg','grandma.svg','basket.svg',
      'radish.svg','goat.svg','girl.svg','unicorn.svg','pip-pig.svg',
      'pig-pop.svg','pig-pudge.svg','wolf-big.svg','dino-trixie.svg','shark.svg','polar-bear.svg'].concat(BALLOON_COLORS.map(c=>'balloon-'+c.name+'.svg'));
    const run=()=>list.forEach(f=>{ const im=new Image(); im.src='img/'+f; });
    if('requestIdleCallback' in window) requestIdleCallback(run,{timeout:3000}); else Playbox.session.timeout(run,1500);
  })();

  window.addEventListener('resize', ()=>{
    play.querySelectorAll('.critter').forEach(c=>{
      const size=parseFloat(c.style.fontSize)||90;
      const maxX=window.innerWidth-size;
      if(parseFloat(c.style.left)>maxX) c.style.left=Math.max(10,maxX)+'px';
    });
  });
})();
</script>
<script>if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }</script>
<script src="app-shell.js"></script>
